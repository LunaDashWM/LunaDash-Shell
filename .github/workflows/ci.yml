name: Shell CI

# CI only builds: SlintLu, the shell (slintlu check compiles every component) and an install
# tree. Translations, the installer checks and the headless run are local
# (scripts/extract-tr.py, scripts/headless-check.sh); run them before pushing.

on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  BUILD_PACKAGES: pkg-config libwayland-dev libxkbcommon-dev libfontconfig-dev libpam0g-dev
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: ${{ env.BUILD_PACKAGES }}
          version: shell-2
      - name: Latest SlintLu revision
        id: slintlu
        run: echo "rev=$(git ls-remote https://github.com/LunaDashWM/SlintLu.git refs/heads/main | cut -f1)" >> "$GITHUB_OUTPUT"
      - name: Cache SlintLu
        id: cache
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/slintlu
          key: slintlu-${{ runner.os }}-${{ steps.slintlu.outputs.rev }}
      - uses: dtolnay/rust-toolchain@stable
        if: steps.cache.outputs.cache-hit != 'true'
      - name: Build SlintLu
        if: steps.cache.outputs.cache-hit != 'true'
        run: cargo install --locked --git https://github.com/LunaDashWM/SlintLu.git --rev ${{ steps.slintlu.outputs.rev }} slintlu
      - name: Build the shell
        run: ~/.cargo/bin/slintlu check .
      - name: Build the install tree
        run: PATH="$HOME/.cargo/bin:$PATH" ./install.sh --prefix /usr --destdir "$RUNNER_TEMP/stage"
